services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_ADDR: ":8080"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.35.1
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      DISPLAY_REQUEST_DURATION: "true"
      TRY_IT_OUT_ENABLED: "true"
    volumes:
      - ./api/openapi.yaml:/spec/openapi.yaml:ro
      - ./api/swagger-nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    depends_on:
      - api
    restart: unless-stopped
